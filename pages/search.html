---
layout: page
title: Search
sitemap: false
permalink: /search/
not_editable: true
excluded_in_search: true
show_title: false
---

<header class="doc-header">
  <div class="doc-header__designator">wiki · search</div>
  <h1 class="doc-header__title">Search</h1>
</header>

<form class="search-form" action="{{ site.baseurl }}/search/" method="get" role="search">
  <div class="hero-search brush brush--sm brush--recess">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" name="q" id="search-input" placeholder="Search this site…" aria-label="Search this site" autofocus autocomplete="off">
    <button type="submit">Find</button>
  </div>
</form>

<p class="search-status">
  <span id="search-process">Loading</span> results
  <span id="search-query-container" style="display:none;"> for "<strong id="search-query"></strong>"</span>
</p>

<ul id="search-results"></ul>

<script>
window.data = {
{% assign added = false %}
{% for post in site.docs %}{% unless post.excluded_in_search %}{% if added %},{% endif %}
  "{{ post.url | slugify }}": {
    "id":    "{{ post.url | slugify }}",
    "title": "{{ post.title | xml_escape }}",
    "categories": "{{ post.categories | join: ', ' | xml_escape }}",
    "url":   " {{ post.url | xml_escape }}",
    "content": {{ post.content | strip_html | replace_regex: "[\s/\n]+", " " | strip | jsonify }}
  }
{% assign added = true %}{% endunless %}{% endfor %}
{% for post in site.posts %}{% unless post.excluded_in_search %}{% if added %},{% endif %}
  "{{ post.url | slugify }}": {
    "id":    "{{ post.url | slugify }}",
    "title": "{{ post.title | xml_escape }}",
    "categories": "{{ post.categories | join: ', ' | xml_escape }}",
    "url":   " {{ post.url | xml_escape }}",
    "content": {{ post.content | strip_html | replace_regex: "[\s/\n]+", " " | strip | jsonify }}
  }
{% assign added = true %}{% endunless %}{% endfor %}
{% for post in site.pages %}{% unless post.excluded_in_search %}{% if added %},{% endif %}
  "{{ post.url | slugify }}": {
    "id":    "{{ post.url | slugify }}",
    "title": "{{ post.title | xml_escape }}",
    "categories": "{{ post.categories | join: ', ' | xml_escape }}",
    "url":   " {{ post.url | xml_escape }}",
    "content": {{ post.content | strip_html | replace_regex: "[\s/\n]+", " " | strip | jsonify }}
  }
{% assign added = true %}{% endunless %}{% endfor %}
};
</script>
<script src="{{ site.baseurl }}/assets/js/lunr.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/search.js"></script>
