<header class="site-header">
  <div class="site-header__inner">
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }} home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3ED1BD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
      Wiki
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="{{ site.baseurl }}/docs/">Docs</a>
      <a href="{{ site.baseurl }}/news/">News</a>
      <a href="{{ site.baseurl }}/about/">About</a>
      {% for link in site.data.navigation %}{% if link.external_url %}
        <a href="{{ link.external_url }}" target="_blank" rel="noopener">{{ link.title }}<span class="ext" aria-hidden="true">&#8599;</span></a>
      {% endif %}{% endfor %}
    </nav>

    <div class="header-spacer"></div>

    <form class="search-box brush brush--xs brush--recess" action="{{ site.baseurl }}/search/" method="get" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" name="q" class="js-search" placeholder="Search this site…" aria-label="Search this site" autocomplete="off">
    </form>

    {% if site.repo %}
    <a class="gh-source" href="{{ site.repo }}" target="_blank" rel="noopener" title="{{ site.github_user }}/{{ site.github_repo }} on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <ul class="gh-source__facts">
        <li id="gh-stars" class="gh-source__fact">—</li>
        <li id="gh-forks" class="gh-source__fact">—</li>
      </ul>
    </a>
    {% endif %}

    {% if site.data.ecosystem %}
    <nav class="nav ecosystem" aria-label="gscode ecosystem">
      {% for link in site.data.ecosystem %}
        <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}<span class="ext" aria-hidden="true">&#8599;</span></a>
      {% endfor %}
    </nav>
    {% endif %}
  </div>
</header>
